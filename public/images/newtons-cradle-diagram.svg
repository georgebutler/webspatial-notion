<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title description">
  <title id="title">Newton's Cradle motion diagram</title>
  <description id="description">Five suspended metal balls demonstrate momentum transferring from a raised ball on the left to a moving ball on the right.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f8f6"/>
      <stop offset="1" stop-color="#ececea"/>
    </linearGradient>
    <radialGradient id="metal" cx="32%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#d8d9dc"/>
      <stop offset="0.7" stop-color="#8a8d92"/>
      <stop offset="1" stop-color="#4d5055"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#37352f"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="28" fill="url(#background)"/>
  <g fill="none" stroke="#37352f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 490V115H790V490" stroke-width="18"/>
    <path d="M125 500H835" stroke-width="24"/>
    <path d="M190 125H770" stroke-width="12"/>
  </g>
  <g stroke="#77756f" stroke-width="4">
    <path d="M342 130L352 365"/>
    <path d="M412 130L422 365"/>
    <path d="M482 130L492 365"/>
    <path d="M552 130L562 365"/>
    <path d="M622 130L632 365"/>
    <path d="M265 146L209 331"/>
    <path d="M699 146L755 331"/>
  </g>
  <g fill="url(#metal)" stroke="#55585d" stroke-width="4">
    <circle cx="352" cy="405" r="44"/>
    <circle cx="422" cy="405" r="44"/>
    <circle cx="492" cy="405" r="44"/>
    <circle cx="562" cy="405" r="44"/>
    <circle cx="632" cy="405" r="44"/>
    <circle cx="196" cy="371" r="44"/>
    <circle cx="768" cy="371" r="44"/>
  </g>
  <g fill="none" stroke="#37352f" stroke-width="5" marker-end="url(#arrow)">
    <path d="M160 292C110 335 105 401 142 447"/>
    <path d="M800 447C837 401 832 335 782 292"/>
  </g>
  <g fill="#37352f" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="92" y="265" font-size="22" font-weight="650">Release</text>
    <text x="774" y="265" font-size="22" font-weight="650">Response</text>
    <text x="480" y="560" font-size="23" text-anchor="middle" font-weight="650">Momentum and energy transfer through the aligned balls</text>
    <text x="480" y="590" font-size="17" text-anchor="middle" fill="#6f6f6f">Idealized elastic collisions produce a nearly equal motion on the opposite side</text>
  </g>
</svg>
